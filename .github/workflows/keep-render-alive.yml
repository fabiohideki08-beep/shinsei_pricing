name: Keep Render Alive

on:
  schedule:
    - cron: '*/10 * * * *'   # a cada 10 minutos
  workflow_dispatch:           # permite rodar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render /health
        run: |
          echo "Fazendo ping em $(date)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://shinsei-pricing.onrender.com/health)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Render acordado e saudável"
          else
            echo "⚠️ Status inesperado: $STATUS"
          fi
